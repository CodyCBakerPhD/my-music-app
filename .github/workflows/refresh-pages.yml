name: Refresh pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # No lockfile to cache by until the app lands.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      # Until the app lands, publish the placeholder page so that the
      # `gh-pages` branch exists for Pages to be enabled on.
      - name: Build site
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            mkdir -p dist
            cp index.html dist/
          fi

      # Leaves `pr-preview/` alone, which holds the open pull requests'
      # previews, and rebases rather than force-pushes so that a preview
      # deployed meanwhile is not lost.
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
